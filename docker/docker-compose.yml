# =============================================================================
# DataCatalog AI - Docker Compose Configuration
# =============================================================================
# Development environment with hot-reload and local services
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: datacatalog-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=datacatalog
      - POSTGRES_PASSWORD=datacatalog_dev
      - POSTGRES_DB=datacatalog
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datacatalog -d datacatalog"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datacatalog-network

  # ---------------------------------------------------------------------------
  # API Service
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: datacatalog-api
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=console
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-super-secret-key-minimum-32-chars-long-change-in-prod}
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:8000"]
      - DATABASE_URL=postgresql+asyncpg://datacatalog:datacatalog_dev@postgres:5432/datacatalog
    volumes:
      # Mount source for hot-reload in development
      - ../src:/app/src:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - datacatalog-network

  # ---------------------------------------------------------------------------
  # ChromaDB Vector Store (Development)
  # ---------------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma:latest
    container_name: datacatalog-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb-data:/chroma/chroma
    environment:
      - ANONYMIZED_TELEMETRY=false
    networks:
      - datacatalog-network

  # ---------------------------------------------------------------------------
  # Redis Cache (Optional - for future use)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: datacatalog-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datacatalog-network

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  datacatalog-network:
    driver: bridge

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
  chromadb-data:
  redis-data:
